[project]
name = "culturaquant"
version = "0.1.0"
description = "Differential cultural-knowledge erosion under SLM quantization (Brazilian Portuguese)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
# The scoring engine (Form 2) needs these; the no-GPU analysis (Form 1, reproduce.sh)
# needs only the Python standard library.
dependencies = [
    "torch>=2.5,<2.9",
    "transformers>=4.44,<4.57",
    "accelerate>=0.34,<1.6",
    "bitsandbytes>=0.43,<0.49",
    "numpy>=1.26,<2.3",
    "sentencepiece>=0.2,<0.3",
]

[project.scripts]
culturaquant-score = "culturaquant.score_cyclic:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/culturaquant"]

[tool.ruff]
line-length = 100

# The packaged tool (src/) and its tests are linted strictly. The analysis scripts under
# analysis/ are deliberately compact single-file analyses; relax only the statement-style
# and defensive-parsing rules there, never the bug-catching ones.
[tool.ruff.lint.per-file-ignores]
"analysis/**" = ["E701", "E702", "E703", "E722", "E402", "E731", "E741"]
