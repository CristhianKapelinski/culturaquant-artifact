[project]
name = "culturaquant"
version = "0.1.0"
description = "Differential cultural-knowledge erosion under SLM quantization (Brazilian Portuguese)"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "torch>=2.5,<2.9",
    "transformers>=4.44,<4.57",
    "accelerate>=0.34,<1.6",
    "bitsandbytes>=0.43,<0.49",
    "datasets>=2.20,<4.2",
    "numpy>=1.26,<2.3",
    "sentencepiece>=0.2,<0.3",
]

[project.scripts]
culturaquant-run = "culturaquant.run:main"
culturaquant-analyze = "culturaquant.analyze:main"

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "ruff>=0.6,<0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/culturaquant"]

[tool.ruff]
line-length = 100
